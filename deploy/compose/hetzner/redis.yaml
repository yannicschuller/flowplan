# Redis for the Hetzner example (README.md), on its own small server:
#   docker compose -f redis.yaml up -d
# Pub/sub, presence and rate limits only – nothing to persist. Listens on
# the private network only and requires a password.
name: flowplan-redis

services:
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}", "--save", "", "--appendonly", "no"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${PRIVATE_IP:?set PRIVATE_IP in .env (this server's address in the private network)}:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
