# Example: one pod with SQLite on a volume – for a team of up to about 20
# people active at the same time (docs.flowplan.org/sizing). Updates have a
# short downtime (Recreate). Everything secret is in Secrets you create
# first; this file holds placeholders only:
#
#   kubectl create namespace flowplan
#   kubectl -n flowplan create secret generic flowplan-env \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=SMTP_PASSWORD='<smtp password>' \
#     --from-literal=S3_ACCESS_KEY_ID='<key id>' \
#     --from-literal=S3_SECRET_ACCESS_KEY='<secret key>'
#   helm install flowplan deploy/helm/flowplan -n flowplan -f deploy/helm/flowplan/values-small.yaml
#
# Keep a copy of FLOWPLAN_ENCRYPTION_KEY apart from the backups.

appUrl: https://flowplan.example.org

# The chart generates the setup token once (Secret flowplan-setup); the
# first account is created at <appUrl>/register?setup=<token>.
setupToken:
  generate: true

existingSecret: flowplan-env

smtp:
  host: smtp.example.org
  port: 587
  user: flowplan@example.org
  from: Flowplan <flowplan@example.org>

# Optional but recommended: files mirrored to S3 and the SQLite database
# replicated continuously (Litestream) – a lost volume comes back from there.
s3:
  bucket: flowplan-backup
  endpoint: https://s3.example.org
  region: eu-central-1

persistence:
  enabled: true
  # A block or local file system for SQLite (no NFS).
  storageClass: ""
  size: 20Gi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: flowplan.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: flowplan-tls
      hosts:
        - flowplan.example.org

# "Small" in the sizing guide: 2 vCPU, 2–4 GB RAM (text recognition of
# scanned PDFs and large imports use the most).
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi
