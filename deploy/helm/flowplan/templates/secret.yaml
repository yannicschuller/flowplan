{{- if include "flowplan.generatesSetupToken" . }}
# The only secret the chart makes itself: FLOWPLAN_SETUP_TOKEN, random once
# and then kept (lookup; also on uninstall). Not part of the pods'
# checksum: a render without access to the cluster does not restart them.
# Everything else comes from Secrets you create (existingSecret, …).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowplan.setupTokenSecret" . }}
  labels:
    {{- include "flowplan.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  FLOWPLAN_SETUP_TOKEN: {{ include "flowplan.generatedSetupToken" . | b64enc | quote }}
{{- end }}
