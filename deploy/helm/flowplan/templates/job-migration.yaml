{{- if and .Values.cluster.enabled .Values.cluster.migration.enabled }}
{{- include "flowplan.check" . }}
# Cluster mode: this version's schema in PostgreSQL before the pods of a new
# version start (scripts/db-schema.mjs in the image; adds, never drops;
# nothing to do when the database is current). Runs before install and
# every upgrade; a failure stops the upgrade before any pod is replaced.
# The pods check the schema again at their start (under the same advisory
# lock – nothing to do then) and are not ready while it is older than
# theirs.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "flowplan.fullname" . }}-schema
  labels:
    {{- include "flowplan.otherPodLabels" (dict "root" . "component" "schema") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.cluster.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.cluster.migration.activeDeadlineSeconds }}
  template:
    metadata:
      # Not the selector labels: the Service and the PodDisruptionBudget must
      # not count this pod as a Flowplan server.
      labels:
        {{- include "flowplan.otherPodLabels" (dict "root" . "component" "schema") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The namespace's default account: a pre-install hook runs before the
      # chart's own ServiceAccount exists. It talks to PostgreSQL only.
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: schema
          image: {{ include "flowplan.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "/app/scripts/db-schema.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "flowplan.databaseEnv" . | nindent 12 }}
            - name: HOME
              value: /tmp
          {{- with .Values.cluster.migration.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
