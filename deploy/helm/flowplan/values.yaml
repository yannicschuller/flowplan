# Flowplan Helm chart. By default Flowplan keeps its data in SQLite on a
# volume and runs as exactly one pod (no replicas, no rolling updates).
# With cluster.enabled it runs several pods against PostgreSQL, Redis and
# S3 object storage instead (see "cluster" below and the README).
# Full configuration reference: https://docs.flowplan.org/configuration

image:
  repository: ghcr.io/yannicschuller/flowplan
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Public address exactly as typed in the browser (scheme, host, port; no
# trailing slash). Required: used for sign-in redirects, cookies, passkeys
# and links. With the ingress enabled it is usually https://<first host>.
appUrl: ""

# E-mail + password and passkeys. false leaves only single sign-on.
localLogin: true

# FLOWPLAN_SETUP_TOKEN: the first account (and the restore on the setup
# screen) only works via <appUrl>/register?setup=<token>, so nobody who
# reaches the address first can take over the instance. Empty: the chart
# generates a random token (kept across upgrades) while localLogin is on.
# Read it with
#   kubectl -n <namespace> get secret <the chart's Secret, e.g. flowplan> \
#     -o jsonpath='{.data.FLOWPLAN_SETUP_TOKEN}' | base64 -d
# A FLOWPLAN_SETUP_TOKEN in existingSecret wins. No effect once the first
# account exists.
setupToken: ""

# Single sign-on with OpenID Connect. Redirect URI at the provider:
# <appUrl>/api/auth/callback
oidc:
  issuer: ""
  clientId: flowplan
  # Better in existingSecret as OIDC_CLIENT_SECRET.
  clientSecret: ""
  scopes: openid profile email groups
  groupsClaim: groups
  adminGroup: flowplan-admins
  allowedGroup: ""

# E-mail for invitations and notification digests.
smtp:
  host: ""
  port: 587
  user: ""
  # Better in existingSecret as SMTP_PASSWORD.
  password: ""
  from: ""

# S3-compatible storage: files are mirrored there and the database is
# replicated continuously with Litestream (restored on start when the
# volume is empty).
s3:
  bucket: ""
  endpoint: ""
  region: us-east-1
  prefix: flowplan
  # Better in existingSecret as S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY.
  accessKeyId: ""
  secretAccessKey: ""

# Encryption of files in the bucket, backups and exports (32 bytes, base64:
# openssl rand -base64 32). Better in existingSecret as
# FLOWPLAN_ENCRYPTION_KEY. Keep a copy apart from the backups.
encryptionKey: ""

# Cluster mode: several replicas against one PostgreSQL database, with
# Redis (live updates, presence, rate limits between the pods) and S3 (the
# files; s3.bucket above, credentials in existingSecret) – all three
# required; the pods refuse to start without one. No volume: each pod's
# /app/data is a cache (emptyDir). The chart takes the connection strings
# only as references to Secrets you create, e.g.
#   kubectl create secret generic flowplan-cluster \
#     --from-literal=DATABASE_URL='postgres://flowplan:…@postgres:5432/flowplan' \
#     --from-literal=REDIS_URL='redis://:…@redis:6379/0'
# (the role in DATABASE_URL owning the database, but no superuser: README,
# "Database role"), and the keys every pod must share (cluster.keys):
#   npx web-push generate-vapid-keys      # the two push keys
#   kubectl create secret generic flowplan-keys \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=WEB_PUSH_PUBLIC_KEY='…' --from-literal=WEB_PUSH_PRIVATE_KEY='…'
cluster:
  enabled: false
  replicas: 2
  database:
    # Secret and key holding DATABASE_URL (postgres://…).
    existingSecret: ""
    key: DATABASE_URL
  redis:
    # Secret and key holding REDIS_URL (redis:// or rediss://).
    existingSecret: ""
    key: REDIS_URL
  keys:
    # Secret holding the keys every pod shares: the encryption key (stored
    # secrets, two-factor, files, backups) and the web push (VAPID) key
    # pair. Required – otherwise each pod would generate its own. Its
    # FLOWPLAN_ENCRYPTION_KEY wins over encryptionKey above.
    existingSecret: ""
    encryptionKey: FLOWPLAN_ENCRYPTION_KEY
    webPushPublicKey: WEB_PUSH_PUBLIC_KEY
    webPushPrivateKey: WEB_PUSH_PRIVATE_KEY
  # PostgreSQL connections per pod (FLOWPLAN_PG_POOL). replicas × (pool + 2)
  # must stay below the server's max_connections (or use PgBouncer ≥ 1.21
  # with max_prepared_statements).
  poolSize: 10
  # Before a pod stops, the load balancer gets this long to take it out of
  # the rotation (readiness turns 503 at the same time).
  preStopSeconds: 5
  # Size limit of the per-pod file cache (emptyDir).
  cacheSizeLimit: 5Gi
  # The schema step before each install/upgrade (a Job running
  # node /app/scripts/db-schema.mjs; adds, never drops). Off: the pods apply it at
  # their first start themselves (under a lock).
  migration:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 900
    resources: {}
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Spread the pods over nodes (preferred, not required).
  spreadOverNodes: true

# An existing Secret whose keys are environment variables, e.g.
#   kubectl create secret generic flowplan-env \
#     --from-literal=OIDC_CLIENT_SECRET=… \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)"
# Its values win over the secret values above.
existingSecret: ""

# Further plain settings as environment variables (see .env.example), e.g.
#   SESSION_HOURS: "8"
#   FLOWPLAN_TRUSTED_PROXIES: "1"
env: {}
# Further environment entries in Kubernetes form (valueFrom etc.).
extraEnv: []
# Further envFrom sources (ConfigMaps or Secrets).
extraEnvFrom: []

persistence:
  # (Single pod only; cluster mode uses no volume.)
  # SQLite database, uploads and keys in /app/data. Without persistence the
  # data is lost with the pod – only for trying it out.
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  # "" uses the cluster's default storage class; "-" sets none.
  storageClass: ""
  # SQLite needs a block or local file system (no NFS/SMB with locking
  # problems). One pod only, so ReadWriteOnce is enough.
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
    # nginx.ingress.kubernetes.io/proxy-body-size: 110m
    # Live editing uses long-lived server-sent event streams (kept alive
    # every 15 s); with ingress-nginx:
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
    # nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  hosts:
    - host: flowplan.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flowplan-tls
  #    hosts:
  #      - flowplan.example.org

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Flowplan does not talk to the Kubernetes API.
  automount: false

podAnnotations: {}
podLabels: {}

# The image runs as the user "node" (uid/gid 1000).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # Next.js writes its cache below /app/.next.
  readOnlyRootFilesystem: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

# Probes on /api/health (database and upload directory). The startup probe
# allows time for a Litestream restore from S3 on the first start. In
# cluster mode: liveness and startup on /api/health/live (the process),
# readiness on /api/health/ready (database, Redis, bucket; 503 while the
# pod stops).
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60
livenessProbe:
  enabled: true
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Time for pending work (uploads to S3, Litestream) when the pod stops.
terminationGracePeriodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}
