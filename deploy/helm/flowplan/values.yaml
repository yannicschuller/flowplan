# Flowplan Helm chart. By default Flowplan keeps its data in SQLite on a
# volume and runs as exactly one pod (no replicas, no rolling updates).
# With cluster.enabled it runs several pods against PostgreSQL, Redis and
# S3 object storage instead (see "cluster" below and the README).
# Examples: values-small.yaml (one pod) and values-ha.yaml (several pods).
# Full configuration reference: https://docs.flowplan.org/configuration
#
# Secrets are never values of this chart: passwords, keys and tokens come
# from Secrets you create (existingSecret, s3.existingSecret, cluster.*,
# setupToken.existingSecret, metrics.tokenSecret) – only the setup token
# can be generated by the chart.

image:
  repository: ghcr.io/yannicschuller/flowplan
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Public address exactly as typed in the browser (scheme, host, port; no
# trailing slash). Required: used for sign-in redirects, cookies, passkeys
# and links. With the ingress enabled it is usually https://<first host>.
appUrl: ""

# E-mail + password and passkeys. false leaves only single sign-on.
localLogin: true

# FLOWPLAN_SETUP_TOKEN: the first account (and the restore on the setup
# screen) only works via <appUrl>/register?setup=<token>, so nobody who
# reaches the address first can take over the instance. No effect once the
# first account exists.
setupToken:
  # A Secret of yours with the token (recommended with GitOps tools that
  # render the chart without access to the cluster, e.g. Argo CD).
  existingSecret: ""
  key: FLOWPLAN_SETUP_TOKEN
  # Without existingSecret: the chart makes the Secret <fullname>-setup with
  # a random token once and keeps it (lookup; kept on uninstall). Read it
  # with
  #   kubectl -n <namespace> get secret <fullname>-setup \
  #     -o jsonpath='{.data.FLOWPLAN_SETUP_TOKEN}' | base64 -d
  generate: true

# Single sign-on with OpenID Connect. Redirect URI at the provider:
# <appUrl>/api/auth/callback. The client secret goes into existingSecret
# as OIDC_CLIENT_SECRET.
oidc:
  issuer: ""
  clientId: flowplan
  scopes: openid profile email groups
  groupsClaim: groups
  adminGroup: flowplan-admins
  allowedGroup: ""

# E-mail for invitations and notification digests. The password goes into
# existingSecret as SMTP_PASSWORD.
smtp:
  host: ""
  port: 587
  user: ""
  from: ""

# S3-compatible storage. Single pod: files are mirrored there and the
# SQLite database is replicated with Litestream (restored on start when the
# volume is empty). Cluster mode: the files live there (required).
s3:
  bucket: ""
  endpoint: ""
  region: us-east-1
  prefix: flowplan
  # A Secret with the access keys (or put S3_ACCESS_KEY_ID and
  # S3_SECRET_ACCESS_KEY into existingSecret).
  existingSecret: ""
  accessKeyIdKey: S3_ACCESS_KEY_ID
  secretAccessKeyKey: S3_SECRET_ACCESS_KEY

# Cluster mode: several replicas against one PostgreSQL database, with
# Redis (live updates, presence, rate limits between the pods) and S3 (the
# files) – all three required; the pods refuse to start without one. No
# volume: each pod's /app/data is a cache (emptyDir). The chart takes the
# connection strings only as references to Secrets you create, e.g.
#   kubectl create secret generic flowplan-cluster \
#     --from-literal=DATABASE_URL='postgres://flowplan:<password>@postgres:5432/flowplan' \
#     --from-literal=REDIS_URL='redis://:<password>@redis:6379/0'
# (the role in DATABASE_URL owning the database, but no superuser: README,
# "Database role"), and the keys every pod must share (cluster.keys):
#   npx web-push generate-vapid-keys      # the two push keys
#   kubectl create secret generic flowplan-keys \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=WEB_PUSH_PUBLIC_KEY='<public key>' --from-literal=WEB_PUSH_PRIVATE_KEY='<private key>'
cluster:
  enabled: false
  replicas: 2
  database:
    # Secret and key holding DATABASE_URL (postgres://…).
    existingSecret: ""
    key: DATABASE_URL
    # A PostgreSQL schema other than public (FLOWPLAN_PG_SCHEMA), e.g. when
    # several installations share one database.
    schema: ""
    # DATABASE_SESSION_URL: behind PgBouncer in transaction mode, an address
    # with sessions of their own (the server itself) for LISTEN, the
    # leader's lock and pg_dump.
    sessionUrl:
      existingSecret: ""
      key: DATABASE_SESSION_URL
  redis:
    # Secret and key holding REDIS_URL (redis:// or rediss://).
    existingSecret: ""
    key: REDIS_URL
  keys:
    # Secret holding the keys every pod shares: the encryption key (stored
    # secrets, two-factor, files, backups) and the web push (VAPID) key
    # pair. Required – otherwise each pod would generate its own.
    existingSecret: ""
    encryptionKey: FLOWPLAN_ENCRYPTION_KEY
    webPushPublicKey: WEB_PUSH_PUBLIC_KEY
    webPushPrivateKey: WEB_PUSH_PRIVATE_KEY
  # PostgreSQL connections per pod (FLOWPLAN_PG_POOL). replicas × (pool + 3)
  # must stay below the server's max_connections (or use PgBouncer ≥ 1.21
  # with max_prepared_statements).
  poolSize: 10
  # Which shared services decide readiness (FLOWPLAN_READY_REQUIRE). Without
  # redis here, a Redis outage does not take every pod out of the rotation
  # at once: editing goes on, live updates between pods pause and resume.
  readyRequire: database,objectStorage
  # Before a pod stops, the load balancer gets this long to take it out of
  # the rotation (readiness turns 503 at the same time).
  preStopSeconds: 5
  # Size limit of the per-pod file cache (emptyDir). Imports are staged
  # there as well: raise it for imports larger than about half of it.
  cacheSizeLimit: 5Gi
  # FLOWPLAN_CACHE_MAX_MB: the least used files are removed from the cache
  # above this. Empty: 70 % of cacheSizeLimit.
  cacheMaxMb: ""
  # The schema step before each install/upgrade (a Job running
  # node /app/scripts/db-schema.mjs; adds, never drops). The pods check the
  # schema at their start as well (under a lock, nothing to do then) and
  # are not ready until it is current.
  migration:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 900
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Spread the pods over nodes (preferred, not required).
  spreadOverNodes: true

# An existing Secret whose keys are environment variables, e.g.
#   kubectl create secret generic flowplan-env \
#     --from-literal=OIDC_CLIENT_SECRET='<secret>' \
#     --from-literal=SMTP_PASSWORD='<password>' \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=FLOWPLAN_METRICS_TOKEN="$(openssl rand -hex 24)"
# Its values win over the plain settings of this chart.
existingSecret: ""

# Further plain settings as environment variables (see .env.example), e.g.
#   SESSION_HOURS: "8"
#   FLOWPLAN_TRUSTED_PROXIES: "1"
env: {}
# Further environment entries in Kubernetes form (valueFrom etc.).
extraEnv: []
# Further envFrom sources (ConfigMaps or Secrets).
extraEnvFrom: []

persistence:
  # (Single pod only; cluster mode uses no volume.)
  # SQLite database, uploads and keys in /app/data. Without persistence the
  # data is lost with the pod – only for trying it out.
  enabled: true
  # Use an existing PersistentVolumeClaim instead of creating one.
  existingClaim: ""
  # "" uses the cluster's default storage class; "-" sets none.
  storageClass: ""
  # SQLite needs a block or local file system (no NFS/SMB with locking
  # problems). One pod only, so ReadWriteOnce is enough.
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  annotations: {}

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ""
  # Live editing keeps server-sent event streams open (a keep-alive every
  # 15 s) and uploads reach 110 MB: with ingress-nginx these annotations
  # turn off buffering and allow long streams and large bodies. Other
  # controllers ignore them – see the README for Traefik, HAProxy and
  # cloud load balancers. false leaves them out.
  nginxDefaults: true
  # Size limit of request bodies for nginxDefaults (uploads; imports of
  # large exports may need more, e.g. "2g").
  bodySize: 110m
  # Further annotations; they win over the defaults above.
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: flowplan.example.org
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: flowplan-tls
  #    hosts:
  #      - flowplan.example.org

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # Flowplan does not talk to the Kubernetes API.
  automount: false

podAnnotations: {}
podLabels: {}

# The image runs as the user "node" (uid/gid 1000, USER in the image).
# Another runAsUser works as well: it writes only to /app/data, /tmp, HOME
# and /app/.next/cache – all of them volumes here, so the root file system
# stays read-only.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true

# Writable scratch space for the read-only root file system (emptyDir):
# /tmp (OCR, imports, exports), Next.js's cache and HOME.
scratch:
  tmpSizeLimit: 2Gi
  nextCacheSizeLimit: 512Mi
  homeSizeLimit: 64Mi

# Per pod, from the sizing guide (docs.flowplan.org/sizing): one dedicated
# core carries about 25–30 people active at the same time; memory for
# imports, exports and text recognition of scanned PDFs. No CPU limit:
# throttling slows live editing for everyone on the pod.
# Several Flowplan processes per pod (env FLOWPLAN_PROCESSES: a number or
# "auto"; docs/architecture/multi-process.md): one per requested core, and
# about 300 MB of memory more per process. More pods (cluster mode) scale
# the same way; in cluster mode every process counts as an instance (its own
# PostgreSQL pool, FLOWPLAN_PG_POOL connections each).
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi

# Probes. Single pod: all on /api/health (database and upload directory).
# Cluster mode: startup and liveness on /api/health/live (the process),
# readiness on /api/health/ready (opening steps and schema done, database,
# bucket – see cluster.readyRequire; 503 while the pod stops). The startup
# probe allows time for a Litestream restore from S3 on the first start.
startupProbe:
  enabled: true
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 60
livenessProbe:
  enabled: true
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Time for a graceful stop: open requests finish, running jobs end, the
# uploads to S3 are drained, the lead goes to another pod. Flowplan uses
# this less cluster.preStopSeconds and 5 s (FLOWPLAN_SHUTDOWN_SECONDS).
terminationGracePeriodSeconds: 30

# Prometheus metrics (/api/metrics with FLOWPLAN_METRICS_TOKEN). Every pod
# reports its own process figures (instance_id label); the installation's
# figures from the database come from the leader only.
metrics:
  # The Secret and key with FLOWPLAN_METRICS_TOKEN (name defaults to
  # existingSecret). The pods get the token from there.
  tokenSecret:
    name: ""
    key: FLOWPLAN_METRICS_TOKEN
  # A ServiceMonitor of the Prometheus Operator (monitoring.coreos.com/v1).
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}

# A NetworkPolicy for the pods (optional): incoming traffic only on the
# HTTP port and only from ingressFrom; with restrictEgress also outgoing
# traffic only to DNS and the destinations in egress.
networkPolicy:
  enabled: false
  # Peers allowed to reach the pods (NetworkPolicyPeer list). Empty: any.
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
  restrictEgress: false
  # Egress rules (NetworkPolicyEgressRule list) besides DNS, e.g. to
  # PostgreSQL, Redis, S3, SMTP and the OIDC provider.
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
