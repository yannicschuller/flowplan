# Example: several pods (cluster mode) against PostgreSQL, Redis and S3 –
# for more people at the same time and updates without downtime. The chart
# does not run PostgreSQL, Redis or S3: use managed services or their own
# charts. Everything secret is in Secrets you create first; this file holds
# placeholders only:
#
#   kubectl create namespace flowplan
#   kubectl -n flowplan create secret generic flowplan-cluster \
#     --from-literal=DATABASE_URL='postgres://flowplan:<password>@postgres:5432/flowplan' \
#     --from-literal=REDIS_URL='redis://:<password>@redis-master:6379/0'
#   kubectl -n flowplan create secret generic flowplan-s3 \
#     --from-literal=S3_ACCESS_KEY_ID='<key id>' \
#     --from-literal=S3_SECRET_ACCESS_KEY='<secret key>'
#   npx web-push generate-vapid-keys     # the two push keys
#   kubectl -n flowplan create secret generic flowplan-keys \
#     --from-literal=FLOWPLAN_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     --from-literal=WEB_PUSH_PUBLIC_KEY='<public key>' \
#     --from-literal=WEB_PUSH_PRIVATE_KEY='<private key>'
#   kubectl -n flowplan create secret generic flowplan-env \
#     --from-literal=OIDC_CLIENT_SECRET='<client secret>' \
#     --from-literal=SMTP_PASSWORD='<smtp password>' \
#     --from-literal=FLOWPLAN_METRICS_TOKEN="$(openssl rand -hex 24)"
#   kubectl -n flowplan create secret generic flowplan-setup \
#     --from-literal=FLOWPLAN_SETUP_TOKEN="$(openssl rand -hex 20)"
#   helm install flowplan deploy/helm/flowplan -n flowplan -f deploy/helm/flowplan/values-ha.yaml
#
# Keep a copy of FLOWPLAN_ENCRYPTION_KEY apart from the backups.

appUrl: https://flowplan.example.org

cluster:
  enabled: true
  # One per ~25 people active at the same time, plus a spare.
  replicas: 3
  database:
    existingSecret: flowplan-cluster
    key: DATABASE_URL
  redis:
    existingSecret: flowplan-cluster
    key: REDIS_URL
  keys:
    existingSecret: flowplan-keys
  # replicas × (poolSize + 3) below PostgreSQL's max_connections.
  poolSize: 15
  # A Redis outage keeps the pods serving (live updates resume after it).
  readyRequire: database,objectStorage
  cacheSizeLimit: 10Gi
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

s3:
  bucket: flowplan
  endpoint: https://s3.example.org
  region: eu-central-1
  existingSecret: flowplan-s3

# A Secret of yours (renders the same everywhere, also with Argo CD/Flux).
setupToken:
  existingSecret: flowplan-setup

existingSecret: flowplan-env

oidc:
  issuer: https://sso.example.org/realms/team
  clientId: flowplan
  adminGroup: flowplan-admins

smtp:
  host: smtp.example.org
  port: 587
  user: flowplan@example.org
  from: Flowplan <flowplan@example.org>

ingress:
  enabled: true
  className: nginx
  # Imports of large exports go through the ingress as one body.
  bodySize: 2g
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
  hosts:
    - host: flowplan.example.org
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: flowplan-tls
      hosts:
        - flowplan.example.org

# "Medium/large" in the sizing guide: 1–2 vCPU, 2 GB RAM per pod.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    memory: 4Gi

terminationGracePeriodSeconds: 45

metrics:
  tokenSecret:
    name: flowplan-env
    key: FLOWPLAN_METRICS_TOKEN
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
