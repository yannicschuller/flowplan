services:
  flowplan:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email groups}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_ADMIN_GROUP: ${OIDC_ADMIN_GROUP:-flowplan-admins}
      OIDC_ALLOWED_GROUP: ${OIDC_ALLOWED_GROUP:-}
      SESSION_HOURS: ${SESSION_HOURS:-8}
    volumes:
      - flowplan-data:/app/data
    restart: unless-stopped
volumes:
  flowplan-data:
