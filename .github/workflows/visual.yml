# Visual regression tests (tests/visual): screenshots of key screens
# compared with the committed baselines. Screens differ a little between
# machines, so the baselines are made on GitHub's ubuntu-latest runner, where
# the job runs – on demand (Actions → Visual regression → Run workflow) or
# for the owner's pushes to main. After an intended change: run it by hand
# with "update" – the new baselines come as the artifact "visual-baselines"
# and as a commit on the branch visual-baselines, to merge into main.
name: Visual regression

on:
  workflow_dispatch:
    inputs:
      update:
        description: Make new baselines (artifact "visual-baselines") instead of comparing
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access only for "update": it pushes the branch visual-baselines.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # The browser's system packages come from Ubuntu. GitHub's runners
        # sometimes cannot resolve security.ubuntu.com (Nov 2026: hours of
        # "Temporary failure resolving"); the runners' own Azure mirror
        # carries the same security pocket. Retried with a pause as well.
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then sudo sed -i -E 's#https?://security\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' "$f"; fi
          done
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Chromium install failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:visual
        if: ${{ !inputs.update }}
      - run: npm run test:visual:update
        if: ${{ inputs.update }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update }}
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
      - name: Baselines as a commit on the branch visual-baselines
        if: ${{ inputs.update }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B visual-baselines
          git add tests/visual/__screenshots__
          git commit -m "Visual baselines from ubuntu-latest" || { echo "Baselines unchanged."; exit 0; }
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" visual-baselines
      # The differences of a failed comparison.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-differences
          path: test-results
          if-no-files-found: ignore
