# Visual regression tests (tests/visual): screenshots of key screens
# compared with the committed baselines. Screens differ a little between
# machines, so the baselines are made on GitHub's ubuntu-latest runner, where
# the job runs – on demand (Actions → Visual regression → Run workflow) or
# for the owner's pushes to main. After an intended change: run it by hand
# with "update" – the new baselines come as the artifact "visual-baselines"
# and as a commit on the branch visual-baselines, to merge into main.
name: Visual regression

on:
  workflow_dispatch:
    inputs:
      update:
        description: Make new baselines (artifact "visual-baselines") instead of comparing
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Write access only for "update": it pushes the branch visual-baselines.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Install Chromium
        # The browser itself comes from Playwright's CDN. Its system packages
        # come from Ubuntu, whose hosts GitHub's runners sometimes cannot
        # resolve for hours (Nov 2026: azure.archive, archive and security
        # .ubuntu.com all "Temporary failure resolving"). The runner image
        # already has the libraries; only extra fonts were missing then. So
        # the packages are tried once, bounded in time, and a failure is a
        # warning; missing fonts would then show up as screenshot differences.
        run: |
          npx playwright install chromium
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 300 npx playwright install-deps chromium || echo "::warning::Chromium's Ubuntu packages could not be installed (Ubuntu mirrors unreachable?); using what the runner image has"
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run test:visual
        if: ${{ !inputs.update }}
      - run: npm run test:visual:update
        if: ${{ inputs.update }}
      - uses: actions/upload-artifact@v7
        if: ${{ inputs.update }}
        with:
          name: visual-baselines
          path: tests/visual/__screenshots__
      - name: Baselines as a commit on the branch visual-baselines
        if: ${{ inputs.update }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B visual-baselines
          git add tests/visual/__screenshots__
          git commit -m "Visual baselines from ubuntu-latest" || { echo "Baselines unchanged."; exit 0; }
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" visual-baselines
      # The differences of a failed comparison.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-differences
          path: test-results
          if-no-files-found: ignore
