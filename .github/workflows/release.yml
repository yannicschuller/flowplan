# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json (patch, minor or major) and the Helm
# chart's appVersion, commits it on
# main together with CHANGELOG.md, tags v1.2.3, creates the GitHub release
# with the curated notes of release-notes/<version>.json and the commits
# since the last release (scripts/release-notes.mjs) and
# publishes the image as :latest, :1.2.3, :1.2 and :1 (docker.yml).
# A version already raised on main but never tagged is released as it is.
# Pushing to the protected main and creating the tag needs the deploy key
# RELEASE_DEPLOY_KEY (environment "production"), which the rulesets let
# through; GitHub's own token may not bypass them.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only the repository owner starts this (collaborators can't): it tags
    # the release and deploys the image.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    # GitHub's runners (free for public repositories): no waiting for a
    # self-hosted machine busy with another workflow.
    runs-on: ubuntu-latest
    environment: production
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - id: version
        run: |
          current="$(node -p 'require("./package.json").version')"
          # Already raised by hand and not released yet: keep it.
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            npm version "${{ inputs.bump }}" --no-git-tag-version
          fi
          version="$(node -p 'require("./package.json").version')"
          # The Helm chart deploys this release by default.
          sed -i "s/^appVersion: .*/appVersion: \"$version\"/" deploy/helm/flowplan/Chart.yaml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The curated notes (release-notes/1.2.3.json, #223) lead the release
      # and CHANGELOG.md, the commits follow folded away; without the file only
      # the commits – a warning, the release still goes out.
      - name: Curated release notes
        run: |
          version="${{ steps.version.outputs.version }}"
          if [ ! -f "release-notes/$version.json" ]; then
            echo "::warning title=No curated release notes::release-notes/$version.json is missing – the release lists the commits only, and \"Neu in Flowplan\" shows nothing for v$version."
          fi
      - name: Changelog from the curated notes and the commits since the last release
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --changelog > "$RUNNER_TEMP/notes.md"
      - name: Contributors in the README (merged pull requests, no bots)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contributors.mjs
      - name: Commit, tag and push
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md deploy/helm/flowplan/Chart.yaml README.md README.de.md
          git diff --cached --quiet || git commit -m "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --title "v${{ steps.version.outputs.version }}"

  image:
    # Only the repository owner starts this (collaborators can't): it tags
    # the release and deploys the image.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
