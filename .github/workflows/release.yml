# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json (patch, minor or major), commits it on
# main together with CHANGELOG.md, tags v1.2.3, creates the GitHub release
# with the commits since the last release (scripts/release-notes.mjs) and
# publishes the image as :latest, :1.2.3, :1.2 and :1 (docker.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Own runner (label self-hosted) for this repository's own work. Dependabot
    # and pull requests from forks run on GitHub's runners instead: their code
    # never reaches the self-hosted machine.
    runs-on: ${{ (github.actor == 'dependabot[bot]' || github.triggering_actor == 'dependabot[bot]' || (github.event_name == 'pull_request' && (github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.head.repo.full_name != github.repository))) && 'ubuntu-latest' || 'self-hosted' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Changelog from the commits since the last release
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --changelog > "$RUNNER_TEMP/notes.md"
      - name: Commit, tag and push
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --title "v${{ steps.version.outputs.version }}"

  image:
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # The desktop apps (desktop/, Electron) for macOS, Windows and Linux, attached
  # to the release. macOS and Windows apps need those systems, so these jobs
  # run on GitHub's runners. Without certificates the apps are unsigned; with
  # the secrets CSC_LINK/CSC_KEY_PASSWORD (macOS, plus APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID for notarization) and
  # WIN_CSC_LINK/WIN_CSC_KEY_PASSWORD (Windows) they are signed.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Version of the release
        working-directory: desktop
        shell: bash
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate: build unsigned instead of searching for one.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' && 'true' || 'false' }}
        run: npx electron-builder ${{ matrix.target }} --publish never
      - name: Attach to the release
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.zip dist/*.exe dist/*.AppImage dist/*.tar.gz)
          gh release upload "v$VERSION" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
