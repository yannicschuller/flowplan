# A release at the push of a button: Actions → Release → Run workflow.
# Raises the version in package.json (patch, minor or major) and the Helm
# chart's appVersion, commits it on
# main together with CHANGELOG.md, tags v1.2.3, creates the GitHub release
# with the commits since the last release (scripts/release-notes.mjs) and
# publishes the image as :latest, :1.2.3, :1.2 and :1 (docker.yml).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which part of the version to raise (1.2.3 → patch 1.2.4, minor 1.3.0, major 2.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only the repository owner starts this (collaborators can't): it runs
    # on the own runner and uses the signing and deploy secrets.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    # Own runner (label self-hosted) only for the repository owner's own
    # work: pushes, runs and pull requests started by the owner from a branch
    # of this repository. Everyone else – collaborators, forks, Dependabot,
    # re-runs started by someone else – runs on GitHub's runners, so their
    # code never reaches the self-hosted machine.
    runs-on: ${{ (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository))) && 'self-hosted' || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - id: version
        run: |
          npm version "${{ inputs.bump }}" --no-git-tag-version
          version="$(node -p 'require("./package.json").version')"
          # The Helm chart deploys this release by default.
          sed -i "s/^appVersion: .*/appVersion: \"$version\"/" deploy/helm/flowplan/Chart.yaml
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Changelog from the commits since the last release
        run: node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" --changelog > "$RUNNER_TEMP/notes.md"
      - name: Commit, tag and push
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md deploy/helm/flowplan/Chart.yaml
          git commit -m "Release v$version"
          git tag "v$version"
          git push origin main "v$version"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --notes-file "$RUNNER_TEMP/notes.md" --title "v${{ steps.version.outputs.version }}"

  image:
    # Only the repository owner starts this (collaborators can't): it runs
    # on the own runner and uses the signing and deploy secrets.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    needs: release
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit
