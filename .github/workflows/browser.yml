# The browser specs (tests/browser, Playwright) against the dev server, on
# demand (Actions → Browser specs → Run workflow). Not on every push: the
# 8 runners take up to an hour each, and a few specs still fail or flake
# against `next dev` (see the commit that moved them here). Apart from CI so
# they do not turn the required run red.
name: Browser specs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    # The browser specs (tests/browser, playwright.config.ts), desktop and
    # phone, split over 8 runners. They run against `next dev`, not the
    # production build: every spec signs in with POST /api/auth/demo, which a
    # production build refuses (403, asserted by check:standalone), and some
    # open the server's database (FLOWPLAN_DATA_DIR). The specs share the one
    # demo account, so each runner has a server and data directory of its own
    # and a single worker.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_BASE_URL: http://127.0.0.1:3000
      # Throwaway data under the name the cursor and inline-comment specs
      # insist on before they write to the database themselves.
      FLOWPLAN_DATA_DIR: /tmp/flowplan-inline-e2e.ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GitHub's runners download Chromium (as in the test job: the browser
      # from Playwright's CDN, its Ubuntu packages best-effort); the own
      # runner downloads nothing and uses the Chromium installed there
      # (/opt/pw-browsers/chromium).
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: |
          npx playwright install chromium
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 300 npx playwright install-deps chromium || echo "::warning::Chromium's Ubuntu packages could not be installed (Ubuntu mirrors unreachable?); using what the runner image has"
      - name: Installed Chromium
        if: runner.environment != 'github-hosted'
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=/opt/pw-browsers/chromium" >> "$GITHUB_ENV"
      - name: Start the dev server
        run: |
          rm -rf "$FLOWPLAN_DATA_DIR" && mkdir -p "$FLOWPLAN_DATA_DIR"
          # A large heap: near its limit `next dev` restarts itself, and the
          # open pages then reload over and over (the specs time out).
          APP_URL="$TEST_BASE_URL" NODE_OPTIONS=--max-old-space-size=8192 \
            nohup npm run dev -- --port 3000 > "$RUNNER_TEMP/dev-server.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null "$TEST_BASE_URL/api/health" && break; sleep 2; done
          # The first request compiles the app; the specs' timeouts do not
          # have to cover that.
          curl -sf -o /dev/null --max-time 600 "$TEST_BASE_URL/"
      # One retry: a dev server compiles routes on first use, and a spec that
      # passes on the second attempt is reported as flaky, not as passed.
      # e2ee.spec.ts needs a data directory of its own (next step).
      - name: Browser specs
        run: |
          npx playwright test $(ls tests/browser/*.spec.ts | grep -v '/e2ee\.spec\.ts$') \
            --shard=${{ matrix.shard }}/8 --retries=1 --trace=retain-on-failure
      # The end-to-end encryption spec on a second server: its own data
      # directory (/tmp/flowplan-e2ee-e2e.*) and build directory.
      - name: E2EE spec
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          TEST_BASE_URL: http://127.0.0.1:3001
          FLOWPLAN_DATA_DIR: /tmp/flowplan-e2ee-e2e.ci
        run: |
          rm -rf "$FLOWPLAN_DATA_DIR" && mkdir -p "$FLOWPLAN_DATA_DIR"
          APP_URL="$TEST_BASE_URL" FLOWPLAN_DIST_DIR=.next-e2ee \
            nohup npm run dev -- --port 3001 > "$RUNNER_TEMP/dev-server-e2ee.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null "$TEST_BASE_URL/api/health" && break; sleep 2; done
          curl -sf -o /dev/null --max-time 600 "$TEST_BASE_URL/"
          npx playwright test tests/browser/e2ee.spec.ts --retries=1 --trace=retain-on-failure
      - name: Dev server log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP"/dev-server*.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore
