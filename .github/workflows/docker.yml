# Builds the Docker image and publishes it to the GitHub Container Registry:
#   ghcr.io/yannicschuller/flowplan:latest         the latest release
#   ghcr.io/yannicschuller/flowplan:1.2.3, :1.2, :1  a release (tag v1.2.3)
#   ghcr.io/yannicschuller/flowplan:beta           the latest push to any branch
#   ghcr.io/yannicschuller/flowplan:sha-abc1234    every build
# For linux/amd64 and linux/arm64. Pull requests only build (no push);
# Dependabot branches get no beta image. Releases come from release.yml,
# which calls this workflow with the version.
name: Docker image

on:
  push:
    branches: ["**", "!dependabot/**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version without "v" (e.g. 1.2.3)
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version && github.ref_type != 'tag' }}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A release: the version from release.yml or from a pushed tag v1.2.3.
      - id: release
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${{ github.ref_type }}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=beta,enable=${{ steps.release.outputs.version == '' }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
