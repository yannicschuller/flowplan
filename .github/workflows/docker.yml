# Builds the Docker image and publishes it to the GitHub Container Registry:
#   ghcr.io/yannicschuller/flowplan:latest         the latest release
#   ghcr.io/yannicschuller/flowplan:1.2.3, :1.2, :1  a release (tag v1.2.3)
#   ghcr.io/yannicschuller/flowplan:beta           the latest manual build, or a
#                                                  release newer than it
#   ghcr.io/yannicschuller/flowplan:sha-abc1234    every build
# For linux/amd64 and linux/arm64, each built natively on GitHub's runners
# (ubuntu-latest and ubuntu-24.04-arm, free for public repositories) in
# parallel, then joined into one multi-platform image. Images are only built for a release
# (release.yml calls this workflow with the version, or a pushed tag v1.2.3)
# or by hand: Actions → Docker image → Run workflow builds :beta from the
# chosen branch, or rebuilds a release when a version is given. Pushes and
# pull requests build no image; CI (ci.yml) tests them. Every new :beta image is
# rolled out on Coolify (COOLIFY_WEBHOOK, COOLIFY_TOKEN; see README).
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: Rebuild this release (e.g. 1.2.3); empty builds :beta
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: Release version without "v" (e.g. 1.2.3)
        type: string
        required: true

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ !inputs.version && github.ref_type != 'tag' }}

jobs:
  # One native build per platform on GitHub's runners – no QEMU emulation,
  # and no waiting for a busy machine.
  # Each pushes its image by digest only; "image" below tags them together.
  build:
    # Only the repository owner builds and publishes images (also via a
    # pushed tag): collaborators and Dependabot can't, and CI tests their work.
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - id: platform
        run: |
          platform="${{ matrix.platform }}"
          echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version && format('v{0}', inputs.version) || '' }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            FLOWPLAN_SKIP_TYPECHECK=1
            GIT_COMMIT=${{ github.sha }}
            FLOWPLAN_CHANNEL=${{ (inputs.version || github.ref_type == 'tag') && 'release' || 'beta' }}
          # GitHub's Actions cache, one scope per platform, kept between runs.
          cache-from: type=gha,scope=image-${{ steps.platform.outputs.pair }}
          cache-to: type=gha,scope=image-${{ steps.platform.outputs.pair }},mode=max
      - name: Remember the digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ steps.platform.outputs.pair }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins both platform images under the tags.
  image:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release: ${{ steps.release.outputs.version }}
      deploy: ${{ steps.newest.outputs.deploy }}
    steps:
      # A release: the version from release.yml or from a pushed tag v1.2.3.
      - id: release
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ] && [ "${{ github.ref_type }}" = "tag" ]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The whole history: a release compares its commit with the :beta one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.version && format('v{0}', steps.release.outputs.version) || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=semver,pattern={{major}},value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=latest,enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=beta,enable=${{ steps.release.outputs.version == '' }}
            type=sha
      # Coolify runs :beta. A beta build always moves it; a release moves it
      # too when it is newer than the current :beta – its commit not already
      # contained in the beta's (every image notes its commit as the
      # annotation org.opencontainers.image.revision). So a release built
      # after the last beta is rolled out as well, an older one is not.
      - id: newest
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository }}"
          release=$(git rev-parse HEAD)
          echo "commit=$release" >> "$GITHUB_OUTPUT"
          if [ -z "$VERSION" ]; then echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          beta=$(docker buildx imagetools inspect --raw "$image:beta" 2>/dev/null | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
          newer=true
          if [ -z "$beta" ]; then
            echo ":beta has no commit noted – the release replaces it."
          elif ! git cat-file -e "$beta^{commit}" 2>/dev/null && ! git fetch -q origin "$beta" 2>/dev/null; then
            echo ":beta is from $beta, which is no longer in the repository – the release replaces it."
          elif git merge-base --is-ancestor "$release" "$beta"; then
            newer=false; echo ":beta ($beta) already contains release $VERSION ($release) – :beta stays."
          elif git merge-base --is-ancestor "$beta" "$release"; then
            echo "Release $VERSION ($release) is newer than :beta ($beta)."
          elif [ "$(git show -s --format=%ct "$release")" -le "$(git show -s --format=%ct "$beta")" ]; then
            newer=false; echo ":beta ($beta, another branch) is more recent than release $VERSION – :beta stays."
          else
            echo "Release $VERSION ($release) is more recent than :beta ($beta, another branch)."
          fi
          echo "deploy=$newer" >> "$GITHUB_OUTPUT"
          if [ "$newer" = true ]; then
            echo "beta=-t $image:beta" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION is also tagged :beta and rolled out on Coolify." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Tag the multi-platform image
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${{ steps.newest.outputs.commit }}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") ${{ steps.newest.outputs.beta }} \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}"

  # Rolls out every new :beta image on Coolify: every manual build without
  # a version, and a release newer than the last beta. Coolify's API must
  # accept GitHub's runners (Settings → Advanced → API access: allowed IPs);
  # the token still guards it.
  deploy:
    needs: image
    if: needs.image.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Coolify secrets live in the environment "production", which only
    # main and tags v* may use (Settings → Environments): a workflow changed
    # on another branch cannot read them.
    environment: production
    steps:
      - name: Deploy on Coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then echo "No Coolify secrets: nothing to deploy."; exit 0; fi
          # Coolify's answer explains a refusal (e.g. a missing permission).
          status=$(curl -sS --retry 3 --max-time 60 -o "$RUNNER_TEMP/coolify.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK")
          echo "Coolify answered $status: $(head -c 500 "$RUNNER_TEMP/coolify.json")"
          if [ "$status" -ge 300 ]; then
            echo "::error::Coolify did not deploy ($status). 401/403: the API token needs the “deploy” permission and the team of the resource; check Settings → Advanced → API access and its allowed IPs."
            exit 1
          fi

  # Known vulnerabilities in the published image (operating system packages
  # and npm dependencies), with Trivy. Reports only – a finding never blocks
  # a release or the beta; it shows in the run's summary. Runs on GitHub's
  # runners.
  scan:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Scan the image with Trivy
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA::7}"
          echo "Scanning $image"
          docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD aquasec/trivy:0.76.1 image \
            --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 0 --format table \
            --timeout 15m "$image" | tee "$RUNNER_TEMP/trivy.txt"
          {
            echo "## Trivy: HIGH and CRITICAL with a fix available"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
