# Every push and pull request: typecheck, tests (on SQLite and, in jobs of
# their own, on PostgreSQL 16), production build, a check
# of the standalone server (health, security defaults, persistence) and the
# accessibility and performance budgets. The browser specs run in browser.yml.
#
# The tests are split over runners (node --test-shard): one runner took
# 9–11 min for them on SQLite and 15–19 min on PostgreSQL, with the build
# and the budgets after them on the same runner. The jobs "test" and
# "postgres" only collect their parts' results, so their names – what branch
# protection asks for – stay as they were.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # GitHub's runners (free for public repositories): no waiting for a
    # self-hosted machine busy with another workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Every test file is a process of its own with its own data folder
      # (tests/helpers/cleanup.mjs); the shards split the files between
      # runners. Six at a time instead of the default three (cores - 1): many
      # wait for their database or a child process, and the whole suite took
      # 8.6–9.2 min instead of 10.7 min locally, three times in a row without
      # a failure.
      - run: npm test
        env:
          TEST_FLAGS: --test-shard=${{ matrix.shard }}/2 --test-concurrency=6

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:standalone
      # Accessibility and performance budgets on the production build
      # (scripts/quality-check.mjs). GitHub's runners download Chromium; the
      # own runner downloads nothing – it uses a Chromium that is installed
      # there or skips the check with a notice.
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        # The browser itself comes from Playwright's CDN. Its system packages
        # come from Ubuntu, whose hosts GitHub's runners sometimes cannot
        # resolve for hours (Nov 2026: azure.archive, archive and security
        # .ubuntu.com all "Temporary failure resolving"). The runner image
        # already has the libraries; only extra fonts were missing then. So
        # the packages are tried once, bounded in time, and a failure is a
        # warning, not a red run.
        run: |
          npx playwright install chromium
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 300 npx playwright install-deps chromium || echo "::warning::Chromium's Ubuntu packages could not be installed (Ubuntu mirrors unreachable?); using what the runner image has"
      - name: Quality budgets
        run: npm run quality
        env:
          QUALITY_OPTIONAL: ${{ runner.environment == 'github-hosted' && '0' || '1' }}

  # The result of the tests on SQLite, the build and the budgets, under the
  # job's old name.
  test:
    needs: [unit, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        run: |
          echo "unit: ${{ needs.unit.result }}, build: ${{ needs.build.result }}"
          test "${{ needs.unit.result }}" = success && test "${{ needs.build.result }}" = success

  postgres-tests:
    # The whole suite once more on PostgreSQL 16 (DATABASE_URL; each test
    # process gets a schema of its own, tests/helpers/postgres-backend.ts),
    # split over runners like the SQLite tests.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        # PostgreSQL 16 with pgvector (the semantic search's tests run with
        # it; without the extension they skip, tests/pgvector.test.ts).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Cluster mode's tests (tests/cluster.test.ts) against a real Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowplan_test
      FLOWPLAN_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Each test schema has about 1,000 objects; parallel test processes
      # dropping or copying them need more lock slots than the default 64.
      # A service container takes no server options: set them and restart.
      - name: Configure Postgres
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET max_locks_per_transaction = 256" -c "ALTER SYSTEM SET max_connections = 400" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres && break; sleep 1; done
          psql "$DATABASE_URL" -tAc "SHOW max_locks_per_transaction" | grep -qx 256
      # pg_dump/pg_restore/psql for the backups (lib/pg-backup.ts): the
      # runner's client must be at least the server's version.
      - name: PostgreSQL client tools
        run: |
          pg_dump --version
          psql "$DATABASE_URL" -tAc "SHOW server_version_num"
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -ge 16
      - run: npm test
        env:
          TEST_FLAGS: --test-shard=${{ matrix.shard }}/2
      - name: Leftover test schemas
        if: always()
        run: node --import tsx tests/helpers/postgres-backend.ts --drop-all

  postgres-build:
    # The production build against PostgreSQL (docs/architecture/database.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowplan_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/check-standalone-postgres.mjs

  # The result of everything on PostgreSQL, under the job's old name.
  postgres:
    needs: [postgres-tests, postgres-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All parts passed
        run: |
          echo "tests: ${{ needs.postgres-tests.result }}, build: ${{ needs.postgres-build.result }}"
          test "${{ needs.postgres-tests.result }}" = success && test "${{ needs.postgres-build.result }}" = success
