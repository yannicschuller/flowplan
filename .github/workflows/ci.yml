# Every push and pull request: typecheck, tests (on SQLite and, in a job of
# its own, on PostgreSQL 16), production build, a check
# of the standalone server (health, security defaults, persistence) and the
# accessibility and performance budgets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's runners (free for public repositories): no waiting for a
    # self-hosted machine busy with another workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:standalone
      # Accessibility and performance budgets on the production build
      # (scripts/quality-check.mjs). GitHub's runners download Chromium; the
      # own runner downloads nothing – it uses a Chromium that is installed
      # there or skips the check with a notice.
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        # The browser's system packages come from Ubuntu. GitHub's runners
        # sometimes cannot resolve security.ubuntu.com (Nov 2026: hours of
        # "Temporary failure resolving"); the runners' own Azure mirror
        # carries the same security pocket. Retried with a pause as well.
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if [ -f "$f" ]; then sudo sed -i -E 's#https?://security\.ubuntu\.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' "$f"; fi
          done
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries > /dev/null
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "Chromium install failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - name: Quality budgets
        run: npm run quality
        env:
          QUALITY_OPTIONAL: ${{ runner.environment == 'github-hosted' && '0' || '1' }}

  postgres:
    # The whole suite once more on PostgreSQL 16 (DATABASE_URL; each test
    # process gets a schema of its own, tests/helpers/postgres-backend.ts),
    # then the production build against it (docs/architecture/database.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # PostgreSQL 16 with pgvector (the semantic search's tests run with
        # it; without the extension they skip, tests/pgvector.test.ts).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Cluster mode's tests (tests/cluster.test.ts) against a real Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowplan_test
      FLOWPLAN_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Each test schema has about 1,000 objects; parallel test processes
      # dropping or copying them need more lock slots than the default 64.
      # A service container takes no server options: set them and restart.
      - name: Configure Postgres
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET max_locks_per_transaction = 256" -c "ALTER SYSTEM SET max_connections = 400" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres && break; sleep 1; done
          psql "$DATABASE_URL" -tAc "SHOW max_locks_per_transaction" | grep -qx 256
      # pg_dump/pg_restore/psql for the backups (lib/pg-backup.ts): the
      # runner's client must be at least the server's version.
      - name: PostgreSQL client tools
        run: |
          pg_dump --version
          psql "$DATABASE_URL" -tAc "SHOW server_version_num"
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -ge 16
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/check-standalone-postgres.mjs
      - name: Leftover test schemas
        if: always()
        run: node --import tsx tests/helpers/postgres-backend.ts --drop-all
