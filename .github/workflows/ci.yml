# Every push and pull request: typecheck, tests (on SQLite and, in a job of
# its own, on PostgreSQL 16), production build, a check
# of the standalone server (health, security defaults, persistence), the
# accessibility and performance budgets and the browser specs (Playwright,
# against the dev server).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # GitHub's runners (free for public repositories): no waiting for a
    # self-hosted machine busy with another workflow.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:standalone
      # Accessibility and performance budgets on the production build
      # (scripts/quality-check.mjs). GitHub's runners download Chromium; the
      # own runner downloads nothing – it uses a Chromium that is installed
      # there or skips the check with a notice.
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        # The browser itself comes from Playwright's CDN. Its system packages
        # come from Ubuntu, whose hosts GitHub's runners sometimes cannot
        # resolve for hours (Nov 2026: azure.archive, archive and security
        # .ubuntu.com all "Temporary failure resolving"). The runner image
        # already has the libraries; only extra fonts were missing then. So
        # the packages are tried once, bounded in time, and a failure is a
        # warning, not a red run.
        run: |
          npx playwright install chromium
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 300 npx playwright install-deps chromium || echo "::warning::Chromium's Ubuntu packages could not be installed (Ubuntu mirrors unreachable?); using what the runner image has"
      - name: Quality budgets
        run: npm run quality
        env:
          QUALITY_OPTIONAL: ${{ runner.environment == 'github-hosted' && '0' || '1' }}

  browser:
    # The browser specs (tests/browser, playwright.config.ts), desktop and
    # phone, split over 8 runners. They run against `next dev`, not the
    # production build: every spec signs in with POST /api/auth/demo, which a
    # production build refuses (403, asserted by check:standalone), and some
    # open the server's database (FLOWPLAN_DATA_DIR). The specs share the one
    # demo account, so each runner has a server and data directory of its own
    # and a single worker.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_BASE_URL: http://127.0.0.1:3000
      # Throwaway data under the name the cursor and inline-comment specs
      # insist on before they write to the database themselves.
      FLOWPLAN_DATA_DIR: /tmp/flowplan-inline-e2e.ci
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # GitHub's runners download Chromium (as in the test job: the browser
      # from Playwright's CDN, its Ubuntu packages best-effort); the own
      # runner downloads nothing and uses the Chromium installed there
      # (/opt/pw-browsers/chromium).
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: |
          npx playwright install chromium
          printf 'Acquire::Retries "1";\nAcquire::http::Timeout "15";\nAcquire::https::Timeout "15";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-timeouts > /dev/null
          timeout 300 npx playwright install-deps chromium || echo "::warning::Chromium's Ubuntu packages could not be installed (Ubuntu mirrors unreachable?); using what the runner image has"
      - name: Installed Chromium
        if: runner.environment != 'github-hosted'
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=/opt/pw-browsers/chromium" >> "$GITHUB_ENV"
      - name: Start the dev server
        run: |
          rm -rf "$FLOWPLAN_DATA_DIR" && mkdir -p "$FLOWPLAN_DATA_DIR"
          # A large heap: near its limit `next dev` restarts itself, and the
          # open pages then reload over and over (the specs time out).
          APP_URL="$TEST_BASE_URL" NODE_OPTIONS=--max-old-space-size=8192 \
            nohup npm run dev -- --port 3000 > "$RUNNER_TEMP/dev-server.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null "$TEST_BASE_URL/api/health" && break; sleep 2; done
          # The first request compiles the app; the specs' timeouts do not
          # have to cover that.
          curl -sf -o /dev/null --max-time 600 "$TEST_BASE_URL/"
      # One retry: a dev server compiles routes on first use, and a spec that
      # passes on the second attempt is reported as flaky, not as passed.
      # e2ee.spec.ts needs a data directory of its own (next step).
      - name: Browser specs
        run: |
          npx playwright test $(ls tests/browser/*.spec.ts | grep -v '/e2ee\.spec\.ts$') \
            --shard=${{ matrix.shard }}/8 --retries=1 --trace=retain-on-failure
      # The end-to-end encryption spec on a second server: its own data
      # directory (/tmp/flowplan-e2ee-e2e.*) and build directory.
      - name: E2EE spec
        if: ${{ !cancelled() && matrix.shard == 1 }}
        env:
          TEST_BASE_URL: http://127.0.0.1:3001
          FLOWPLAN_DATA_DIR: /tmp/flowplan-e2ee-e2e.ci
        run: |
          rm -rf "$FLOWPLAN_DATA_DIR" && mkdir -p "$FLOWPLAN_DATA_DIR"
          APP_URL="$TEST_BASE_URL" FLOWPLAN_DIST_DIR=.next-e2ee \
            nohup npm run dev -- --port 3001 > "$RUNNER_TEMP/dev-server-e2ee.log" 2>&1 &
          for i in $(seq 1 90); do curl -sf -o /dev/null "$TEST_BASE_URL/api/health" && break; sleep 2; done
          curl -sf -o /dev/null --max-time 600 "$TEST_BASE_URL/"
          npx playwright test tests/browser/e2ee.spec.ts --retries=1 --trace=retain-on-failure
      - name: Dev server log
        if: failure()
        run: tail -n 300 "$RUNNER_TEMP"/dev-server*.log
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-results-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  postgres:
    # The whole suite once more on PostgreSQL 16 (DATABASE_URL; each test
    # process gets a schema of its own, tests/helpers/postgres-backend.ts),
    # then the production build against it (docs/architecture/database.md).
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # PostgreSQL 16 with pgvector (the semantic search's tests run with
        # it; without the extension they skip, tests/pgvector.test.ts).
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowplan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Cluster mode's tests (tests/cluster.test.ts) against a real Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowplan_test
      FLOWPLAN_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      # Each test schema has about 1,000 objects; parallel test processes
      # dropping or copying them need more lock slots than the default 64.
      # A service container takes no server options: set them and restart.
      - name: Configure Postgres
        run: |
          psql "$DATABASE_URL" -c "ALTER SYSTEM SET max_locks_per_transaction = 256" -c "ALTER SYSTEM SET max_connections = 400" -c "ALTER SYSTEM SET fsync = off" -c "ALTER SYSTEM SET synchronous_commit = off"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 60); do pg_isready -h localhost -p 5432 -U postgres && break; sleep 1; done
          psql "$DATABASE_URL" -tAc "SHOW max_locks_per_transaction" | grep -qx 256
      # pg_dump/pg_restore/psql for the backups (lib/pg-backup.ts): the
      # runner's client must be at least the server's version.
      - name: PostgreSQL client tools
        run: |
          pg_dump --version
          psql "$DATABASE_URL" -tAc "SHOW server_version_num"
          test "$(pg_dump --version | grep -oE '[0-9]+' | head -1)" -ge 16
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: node scripts/check-standalone-postgres.mjs
      - name: Leftover test schemas
        if: always()
        run: node --import tsx tests/helpers/postgres-backend.ts --drop-all
