# Every push and pull request: typecheck, tests, production build, a check
# of the standalone server (health, security defaults, persistence) and the
# accessibility and performance budgets.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Own runner (label self-hosted) only for the repository owner's own
    # work: pushes, runs and pull requests started by the owner from a branch
    # of this repository. Everyone else – collaborators, forks, Dependabot,
    # re-runs started by someone else – runs on GitHub's runners, so their
    # code never reaches the self-hosted machine.
    runs-on: ${{ (github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && (github.event_name != 'pull_request' || (github.event.pull_request.user.login == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository))) && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # No token left in .git on the runner.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: npm run check:standalone
      # Accessibility and performance budgets on the production build
      # (scripts/quality-check.mjs). GitHub's runners download Chromium; the
      # own runner downloads nothing – it uses a Chromium that is installed
      # there or skips the check with a notice.
      - name: Install Chromium
        if: runner.environment == 'github-hosted'
        run: npx playwright install --with-deps chromium
      - name: Quality budgets
        run: npm run quality
        env:
          QUALITY_OPTIONAL: ${{ runner.environment == 'github-hosted' && '0' || '1' }}
