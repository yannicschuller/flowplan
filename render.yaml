# Render Blueprint for Flowplan – the "Deploy to Render" button in the README
# (https://render.com/deploy?repo=https://github.com/yannicschuller/flowplan).
#
# One web service from the prebuilt image with a persistent disk on /app/data
# (SQLite, uploads, keys). Render offers disks only on paid instance types;
# "starter" is the smallest one that has them. A service with a disk runs as
# exactly one instance, which is what SQLite needs.
#
# APP_URL: left out on purpose. The image's entrypoint takes Render's
# RENDER_EXTERNAL_URL (https://<name>.onrender.com) when APP_URL is empty.
# With a custom domain, set APP_URL=https://<your domain> in the service's
# Environment tab – before the first account is created, as passkeys are
# bound to the address.
#
# First account: FLOWPLAN_SETUP_TOKEN is generated by Render at deploy time.
# Copy it from the Environment tab and open
#   https://<name>.onrender.com/register?setup=<token>
#
# Updates: Render pulls the image when the service deploys. Manual Deploy →
# "Deploy latest reference" fetches the newest :latest release.
# Docs: https://docs.flowplan.org/en/one-click-deploy#render
services:
  - type: web
    name: flowplan
    runtime: image
    image:
      url: ghcr.io/yannicschuller/flowplan:latest
    plan: starter
    region: frankfurt
    numInstances: 1
    healthCheckPath: /api/health
    disk:
      name: flowplan-data
      mountPath: /app/data
      sizeGB: 5
    envVars:
      # Render sets PORT=10000 by default; the image listens on 3000.
      - key: PORT
        value: "3000"
      - key: FLOWPLAN_DATA_DIR
        value: /app/data
      # The first account only via /register?setup=<token>.
      - key: FLOWPLAN_SETUP_TOKEN
        generateValue: true
      # Optional, asked for when the Blueprint is created (may stay empty):
      # e-mail for invitations and forgotten passwords.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
